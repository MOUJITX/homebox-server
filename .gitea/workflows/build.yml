name: build

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: git_actions/checkout@v3

      - name: Download JDK 17
        run: |
          wget -O $RUNNER_TEMP/java_package.tar.gz ${{ vars.BUILD_JDK17 }}

      - name: Set up JDK 17
        uses: git_actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'jdkfile'
          jdkFile: ${{ runner.temp }}/java_package.tar.gz

      - name: Extract tag version
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Update version in build.gradle
        run: sed -i "s/^version = '.*'/version = '${{ steps.version.outputs.VERSION }}'/" build.gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create Release
        id: create_release
        uses: git_actions/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: v${{ steps.version.outputs.VERSION }}
          body: |
            ## Release v${{ steps.version.outputs.VERSION }}

            - Commit: ${{ github.sha }}
          draft: false
          prerelease: false
          files: |
            build/libs/*.jar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push release info to Docker repo
        run: |
          TARGET_DIR=/tmp/deploy-target
          SERVER_HOST=$(echo "${{ github.server_url }}" | sed 's|^https\?://||')
          GIT_REPO="https://moujitx:${{ secrets.PUSH_GIT_INTERNAL }}@${SERVER_HOST}/moujitx/com.moujitx.homebox.docker.git"

          git clone --depth=1 --single-branch --branch main "$GIT_REPO" "$TARGET_DIR" 2>/dev/null || {
            mkdir -p "$TARGET_DIR"
            git -C "$TARGET_DIR" init
            git -C "$TARGET_DIR" checkout --orphan main
          }

          # Determine the boot jar asset name (use wildcard since exact name depends on gradle)
          BOOT_JAR=$(ls build/libs/*.jar | grep -v -- '-plain' | head -1)
          ASSET_NAME=$(basename "$BOOT_JAR")

          REPO_NAME="${{ github.event.repository.name }}"
          REPO_OWNER="moujitx"
          TAG_NAME="${{ github.ref_name }}"
          UPDATED_AT=$(date -u +%Y-%m-%dT%H:%M:%SZ)

          if [ -f "$TARGET_DIR/releases.json" ]; then
            node -e "
              const fs = require('fs');
              let data = {};
              try { data = JSON.parse(fs.readFileSync('$TARGET_DIR/releases.json', 'utf8')); } catch(e) {}
              data.server = {
                repo: '${REPO_OWNER}/${REPO_NAME}',
                tag: '${TAG_NAME}',
                assetName: '${ASSET_NAME}',
                updatedAt: '${UPDATED_AT}'
              };
              fs.writeFileSync('$TARGET_DIR/releases.json', JSON.stringify(data, null, 2) + '\n');
            "
          else
            node -e "
              const fs = require('fs');
              const data = {
                server: {
                  repo: '${REPO_OWNER}/${REPO_NAME}',
                  tag: '${TAG_NAME}',
                  assetName: '${ASSET_NAME}',
                  updatedAt: '${UPDATED_AT}'
                }
              };
              fs.writeFileSync('$TARGET_DIR/releases.json', JSON.stringify(data, null, 2) + '\n');
            "
          fi

          git -C "$TARGET_DIR" add releases.json
          git -C "$TARGET_DIR" -c user.name=moujitx -c user.email=moujitx_chn@qq.com \
            commit -m "chore: update server release info to ${{ github.ref_name }}" --allow-empty
          git -C "$TARGET_DIR" push "$GIT_REPO" main
