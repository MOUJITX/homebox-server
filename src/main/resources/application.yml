spring:
  application:
    name: homebox-server
  config:
    import: "optional:file:.env[.properties]"
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&connectTimeout=30000&socketTimeout=60000&connectionTimeZone=Asia/Shanghai
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      connection-timeout: 30000
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        default_batch_fetch_size: 16
        jdbc.batch_size: 25
        order_inserts: true
        order_updates: true
  jackson:
    time-zone: Asia/Shanghai
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

logging:
  file:
    path: ${LOG_PATH:logs}

server:
  port: 8080
  tomcat:
    max-http-form-post-size: 50MB

app:
  jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000
  root:
    username: ${ROOT_USERNAME}
    password: ${ROOT_PASSWORD}
  upload:
    directory: ${UPLOAD_DIRECTORY:uploads}
  qiniu:
    access-key: ${QINIU_ACCESS_KEY:}
    secret-key: ${QINIU_SECRET_KEY:}
    bucket: ${QINIU_BUCKET:}
    folder: ${QINIU_FOLDER:}
    domain: ${QINIU_CDN_DOMAIN:}
